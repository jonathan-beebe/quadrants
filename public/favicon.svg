<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Gradient-quadrant identity (DSGN-002). Corner colors match the
       bilinear-gradient PNG icons in this directory; the masked second
       gradient approximates the same four-corner blend. Lines are slightly
       heavier than the PNGs' (26px vs 22px at 512) so they survive 16px
       browser-tab rendering. -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E5645"/>
      <stop offset="1" stop-color="#294169"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#384252"/>
      <stop offset="1" stop-color="#564C32"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="bottomMask">
      <rect width="512" height="512" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#top)"/>
  <rect width="512" height="512" fill="url(#bottom)" mask="url(#bottomMask)"/>
  <g fill="#fff" fill-opacity="0.45">
    <rect x="243" y="0" width="26" height="512"/>
    <rect x="0" y="243" width="512" height="26"/>
  </g>
</svg>
